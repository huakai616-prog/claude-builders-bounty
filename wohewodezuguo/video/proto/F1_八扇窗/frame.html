<html lang="zh-CN"><head><meta charset="utf-8">
<title>八扇窗 样帧</title>

<canvas id="c" width="1080" height="1920"></canvas>
<script>
// 《八扇窗》样帧 · 0:53.75 女高音第一次开口「我」
const W=1080,H=1920,GY=1180,HZ=1091,VPX=500;
const BX0=190,BX1=810,BY0=470;
const SHOW_UI = location.hash.includes('ui');
const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
function mk(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return k;}

// ---------- 随机与噪声 ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32(20261001);
const PERM=new Uint16Array(512),VAL=new Float32Array(256);
{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(R()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<512;i++)PERM[i]=p[i&255];for(let i=0;i<256;i++)VAL[i]=R();}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const X=xi&255,Y=yi&255,X1=(X+1)&255,Y1=(Y+1)&255;
 const a=VAL[PERM[PERM[X]+Y]],b=VAL[PERM[PERM[X1]+Y]],c=VAL[PERM[PERM[X]+Y1]],d=VAL[PERM[PERM[X1]+Y1]];
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o=4){let s=0,a=0.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x*f+i*17.3,y*f+i*9.1);n+=a;a*=0.5;f*=2.03;}return s/n;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function ss(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgba(c,a=1){return `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;}

// ---------- 0:53.75 这一刻的灯（由 MIDI 推出） ----------
// 女高音 53.57 起唱「我」；第二小提琴/中提琴/大提琴 53.57 起音；第一小提琴休止
// 楼道灯：51.43 大提琴 → 52.14 中提琴 → 52.68 第二小提琴 接力上行的余光
const C_SOP=hex('#FFF1D6'),C_VOX=hex('#FFB45E'),C_STR=hex('#FFE2B0'),C_STAIR=hex('#FFD27A');
const WINW=150,WINH=100,LX=250,RX=600,FY={4:520,3:680,2:840,1:1000};
const WINDOWS=[
 {id:'L4',x:LX,y:FY[4],col:C_SOP,b:1.00,cur:'sop'},
 {id:'L3',x:LX,y:FY[3],col:C_VOX,b:0.85,cur:'amber',plant:true},
 {id:'L2',x:LX,y:FY[2],col:C_VOX,b:0.80,cur:'amberL'},
 {id:'L1',x:LX,y:FY[1],col:C_VOX,b:0.80,cur:'amber',bars:true},
 {id:'R4',x:RX,y:FY[4],col:C_STR,b:0.12,cur:'dim'},
 {id:'R3',x:RX,y:FY[3],col:C_STR,b:0.70,cur:'sheer'},
 {id:'R2',x:RX,y:FY[2],col:C_STR,b:0.70,cur:'sheerR',lamp:true},
 {id:'R1',x:RX,y:FY[1],col:C_STR,b:0.75,cur:'sheer',plant:true,bars:true},
];
const STAIRS=[{y:1015,b:0.55},{y:855,b:0.70},{y:695,b:0.85},{y:535,b:0.0}];
const DARKWIN=hex('#121826');

// ---------- 天空 ----------
function drawSky(g){
 const gr=g.createLinearGradient(0,0,0,GY);
 gr.addColorStop(0,'#1B2A44');gr.addColorStop(900/GY,'#2B3D60');gr.addColorStop(1,'#3A4F76');
 g.fillStyle=gr;g.fillRect(0,0,W,GY);
 // 天边一点城市与将明的暖灰
 const hg=g.createLinearGradient(0,820,0,GY);
 hg.addColorStop(0,'rgba(150,130,150,0)');hg.addColorStop(1,'rgba(160,140,160,0.20)');
 g.fillStyle=hg;g.fillRect(0,820,W,GY-820);
 // 云：低对比的长条云
 const cw=270,ch=300,cc=mk(cw,ch),cg=cc.getContext('2d'),id=cg.createImageData(cw,ch);
 for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
  const X=x*4,Y=y*4; const n=fbm(X/520+3,Y/70+1,5);
  const env=ss(60,360,Y)*(1-ss(820,1100,Y));
  const body=ss(0.50,0.72,n)*env, rim=ss(0.44,0.52,n)*(1-ss(0.52,0.62,n))*env;
  const i=(y*cw+x)*4;
  const cb=[20,29,50],cr=[96,108,146];
  const a=body*0.55+rim*0.16;
  const t=a>0?(rim*0.16)/a:0; const col=mix(cb,cr,t);
  id.data[i]=col[0];id.data[i+1]=col[1];id.data[i+2]=col[2];id.data[i+3]=a*255;
 }
 cg.putImageData(id,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 g.drawImage(cc,0,0,W,1200);
 // 残星
 for(let i=0;i<70;i++){const x=R()*W,y=R()*620+6;const a=(0.12+R()*0.5)*(1-y/760);const s=R()<0.08?1.5:0.9;
  g.fillStyle=`rgba(225,232,255,${a.toFixed(3)})`;g.beginPath();g.arc(x,y,s,0,7);g.fill();}
}

// ---------- 远处楼群 ----------
function windowsGrid(g,x0,x1,y0,y1,ww,wh,sx,sy,litP,litCol,litA,darkCol,rr){
 for(let y=y0;y+wh<=y1;y+=sy){for(let x=x0;x+ww<=x1;x+=sx){
  if(rr()<litP){const a=litA*(0.55+rr()*0.45);g.fillStyle=rgba(litCol,a);g.fillRect(x,y,ww,wh);
   g.fillStyle=rgba(litCol,a*0.18);g.fillRect(x-3,y-3,ww+6,wh+6);}
  else{g.fillStyle=darkCol;g.fillRect(x,y,ww,wh);} }}
}
function drawFar(g){
 const r=mulberry32(77);
 // 最远的高层：被雾吃掉一半
 const far=[[10,150,640],[108,236,730],[860,1010,600],[965,1080,690],[700,850,770],[250,380,800]];
 for(const [x0,x1,top] of far){
  const col=[36,50,80];
  g.fillStyle=rgba(col,1);g.fillRect(x0,top,x1-x0,GY-top);
  g.fillStyle='rgba(30,42,68,1)';g.fillRect(x0+(x1-x0)*0.35,top-14,(x1-x0)*0.3,14); // 屋顶机房
  windowsGrid(g,x0+10,x1-8,top+16,GY,10,8,20,24,0.07,[255,200,140],0.45,'rgba(28,40,66,1)',r);
 }
 // 薄雾
 const mg=g.createLinearGradient(0,600,0,GY);
 mg.addColorStop(0,'rgba(58,79,118,0.0)');mg.addColorStop(1,'rgba(64,84,122,0.55)');
 g.fillStyle=mg;g.fillRect(0,600,W,GY-600);
}
function drawMid(g){
 const r=mulberry32(4242);
 const blocks=[[0,170,860],[830,1080,800],[150,930,980]];
 for(const [x0,x1,top] of blocks){
  g.fillStyle='#141D33';g.fillRect(x0,top,x1-x0,GY-top);
  g.fillStyle='#10182B';g.fillRect(x0,top,x1-x0,6);
  windowsGrid(g,x0+14,x1-10,top+22,GY-20,18,14,34,40,0.10,hex('#FFC47A'),0.6,'#0F1628',r);
 }
 // 楼顶水箱
 g.fillStyle='#111a2e';g.fillRect(40,838,46,22);g.fillRect(900,776,58,24);g.fillRect(935,760,6,16);
}
// 树冠剪影
function canopy(g,cx,cy,rx,ry,n,col,seed){
 const r=mulberry32(seed);g.fillStyle=col;
 for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.sqrt(r());const x=cx+Math.cos(a)*rx*d*0.8,y=cy+Math.sin(a)*ry*d*0.8;
  const rad=(10+r()*22)*(1-d*0.35);g.beginPath();g.arc(x,y,rad,0,7);g.fill();}
 for(let i=0;i<n*5;i++){const a=r()*Math.PI*2,d=0.78+r()*0.3;const x=cx+Math.cos(a)*rx*d,y=cy+Math.sin(a)*ry*d;
  g.beginPath();g.ellipse(x,y,2+r()*4,1.5+r()*3,r()*3,0,7);g.fill();}
}
function drawTree(g,x0,yb,seed){
 const r=mulberry32(seed),col='#070b14',clumps=[];
 g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';
 const br=(x,y,ang,len,w,dep)=>{
  const bend=(r()-0.5)*0.5,x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
  const mx=x+Math.cos(ang+bend)*len*0.5,my=y+Math.sin(ang+bend)*len*0.5;
  g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(mx,my,x2,y2);g.stroke();
  if(dep===0||len<18){clumps.push([x2,y2,w]);return;}
  const n=r()<0.45?3:2;
  for(let i=0;i<n;i++){let a=ang+(i-(n-1)/2)*0.62+(r()-0.5)*0.35; if(x2>170&&Math.cos(a)>0)a-=0.5;
   br(x2,y2,a,len*(0.66+r()*0.14),w*0.64,dep-1);}
  if(dep<3)clumps.push([x2,y2,w]);
 };
 // 主干分两股
 g.lineWidth=20;g.beginPath();g.moveTo(x0-10,yb);g.quadraticCurveTo(x0+4,yb-120,x0,yb-230);g.stroke();
 br(x0,yb-228,-Math.PI/2-0.38,120,14,5);br(x0,yb-228,-Math.PI/2+0.30,110,12,5);br(x0,yb-200,-Math.PI/2-1.0,80,8,4);
 // 叶团：很多小叶片，边缘稀疏
 for(const [cx,cy] of clumps){const n=120;
  for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.pow(r(),0.7)*40;const x=cx+Math.cos(a)*d*1.2,y=cy+Math.sin(a)*d*0.85;
   if(x>236-r()*18)continue;
   g.globalAlpha=0.55+r()*0.45;g.beginPath();g.ellipse(x,y,2.2+r()*3.6,1.4+r()*2.2,r()*3.14,0,7);g.fill();}}
 g.globalAlpha=1;
}
function trunk(g,x,yb,yt,w,col){g.fillStyle=col;g.beginPath();g.moveTo(x-w,yb);g.lineTo(x-w*0.45,yt);g.lineTo(x+w*0.45,yt);g.lineTo(x+w,yb);g.closePath();g.fill();}

// ---------- 主楼 ----------
function drawBuilding(g){
 const r=mulberry32(1949);
 // 砖
 g.fillStyle='#3E2C28';g.fillRect(BX0,BY0,BX1-BX0,GY-BY0);
 const base=hex('#4A3530');
 g.save();g.beginPath();g.rect(BX0,BY0,BX1-BX0,GY-BY0);g.clip();
 for(let row=0,y=BY0;y<GY;row++,y+=8){const off=(row%2)*12;
  for(let x=BX0-off;x<BX1;x+=24){
   let k=0.86+r()*0.26; let c=[base[0]*k,base[1]*k,base[2]*k];
   const q=r(); if(q<0.06)c=mix(c,[40,26,24],0.5); else if(q<0.11)c=mix(c,[96,62,48],0.35); else if(q<0.14)c=mix(c,[70,62,62],0.4);
   g.fillStyle=rgba(c);g.fillRect(x+1,y+1,23,7);
   g.fillStyle=rgba([c[0]*1.12,c[1]*1.1,c[2]*1.08],0.35);g.fillRect(x+1,y+1,23,1);
  }}
 g.restore();
 // 老化：竖向雨痕、斑驳、墙根返潮
 const id=g.getImageData(BX0,BY0,BX1-BX0,GY-BY0),d=id.data,w=BX1-BX0,h=GY-BY0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const Y=y+BY0,X=x+BX0;
  const streak=fbm(X/7,Y/300,3), blot=fbm(X/55+40,Y/45,4);
  let f=1-0.30*ss(0.52,0.78,streak)-0.22*(blot-0.5)-0.28*ss(1040,1180,Y)+0.06*(1-ss(470,700,Y));
  const i=(y*w+x)*4;d[i]*=f;d[i+1]*=f;d[i+2]*=f;
 }
 g.putImageData(id,BX0,BY0);
 // 蓝调天光：上亮下暗，偏冷
 const tg=g.createLinearGradient(0,BY0,0,GY);
 tg.addColorStop(0,'rgba(70,88,130,0.20)');tg.addColorStop(0.45,'rgba(24,30,52,0.26)');tg.addColorStop(1,'rgba(6,8,14,0.45)');
 g.fillStyle=tg;g.fillRect(BX0,BY0,BX1-BX0,GY-BY0);
 // 左右墙角暗一点（体积感）
 const sg=g.createLinearGradient(BX0,0,BX1,0);
 sg.addColorStop(0,'rgba(0,0,0,0.22)');sg.addColorStop(0.08,'rgba(0,0,0,0)');sg.addColorStop(0.92,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,0.28)');
 g.fillStyle=sg;g.fillRect(BX0,BY0,BX1-BX0,GY-BY0);

 // 圈梁（每层窗顶的水泥带）
 for(const f of [4,3,2,1]){const y=FY[f]-22;concreteBand(g,BX0,y,BX1-BX0,12,r);}
 // 勒脚
 concreteBand(g,BX0,1138,BX1-BX0,42,r,true);
 // 窗下雨痕
 for(const wi of WINDOWS){dirtStreak(g,wi.x-4,wi.y+WINH+10,WINW+8,70,r);}
 for(const s of STAIRS){dirtStreak(g,475,s.y+70+6,50,40,r);}
 // 女儿墙
 g.fillStyle='#3A2A26';g.fillRect(180,450,640,20);
 g.fillStyle='#4b4f5a';g.fillRect(176,445,648,7);g.fillStyle='rgba(140,155,185,0.25)';g.fillRect(176,445,648,1.5);
 g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(180,470,640,5);
 // 落水管
 for(const px of [207,793]){pipe(g,px,452,GY-6);}
}
function concreteBand(g,x,y,w,h,r,plinth){
 const c=plinth?[52,55,62]:[60,58,62];
 g.fillStyle=rgba(c);g.fillRect(x,y,w,h);
 g.fillStyle=rgba([c[0]*1.18,c[1]*1.18,c[2]*1.2],0.45);g.fillRect(x,y,w,1.5);
 for(let i=0;i<w;i+=2){const n=fbm((x+i)/30,y/10,3);g.fillStyle=`rgba(0,0,0,${(0.28*n*n).toFixed(3)})`;g.fillRect(x+i,y+2,2,h-2);}
 const sh=g.createLinearGradient(0,y+h,0,y+h+10);sh.addColorStop(0,'rgba(0,0,0,0.45)');sh.addColorStop(1,'rgba(0,0,0,0)');
 if(!plinth){g.fillStyle=sh;g.fillRect(x,y+h,w,10);}
}
function dirtStreak(g,x,y,w,h,r){
 for(let i=0;i<w;i+=3){const len=h*(0.3+r()*0.7);const a=0.10+r()*0.16;
  const gr=g.createLinearGradient(0,y,0,y+len);gr.addColorStop(0,`rgba(12,8,8,${a})`);gr.addColorStop(1,'rgba(12,8,8,0)');
  g.fillStyle=gr;g.fillRect(x+i,y,3,len);}
}
function pipe(g,x,y0,y1){
 g.fillStyle='#2b2f38';g.fillRect(x-4,y0,8,y1-y0);
 g.fillStyle='rgba(120,135,165,0.35)';g.fillRect(x-3,y0,1.5,y1-y0);
 g.fillStyle='rgba(0,0,0,0.4)';g.fillRect(x+3,y0,1,y1-y0);
 for(let y=y0+60;y<y1-20;y+=150){g.fillStyle='#232730';g.fillRect(x-6,y,12,4);}
 g.fillStyle='#2b2f38';g.fillRect(x-4,y1-4,14,6);
}

// 窗内
function interior(g,wi,x,y,w,h){
 const {col,b,cur}=wi;
 if(b<0.2){ // 几乎暗：只有屋里深处一点灯
  g.fillStyle=rgba(DARKWIN);g.fillRect(x,y,w,h);
  const rg=g.createRadialGradient(x+w*0.62,y+h*0.9,2,x+w*0.62,y+h*0.9,w*0.55);
  rg.addColorStop(0,rgba(col,0.55*b*4));rg.addColorStop(1,rgba(col,0));
  g.fillStyle=rg;g.fillRect(x,y,w,h);
  skyReflect(g,x,y,w,h,0.8);return;
 }
 const hot=mix(col,[255,252,244],0.55), deep=[col[0]*0.78,col[1]*0.50,col[2]*0.26];
 const k=b; const dk=[26,18,16];
 const cH=mix(dk,hot,k), cM=mix(dk,col,k), cD=mix(dk,deep,k);
 const lx=cur==='sop'?0.5:(cur==='amberL'?0.75:0.45);
 const rg=g.createRadialGradient(x+w*lx,y+h*0.28,2,x+w*lx,y+h*0.45,w*0.78);
 rg.addColorStop(0,rgba(cH));rg.addColorStop(0.45,rgba(cM));rg.addColorStop(1,rgba(cD));
 g.fillStyle=rg;g.fillRect(x,y,w,h);
 // 屋顶（天花板）亮、下面暗一点：真实屋里的层次
 const vg=g.createLinearGradient(0,y,0,y+h);vg.addColorStop(0,'rgba(0,0,0,0.0)');vg.addColorStop(0.7,'rgba(0,0,0,0.05)');vg.addColorStop(1,'rgba(0,0,0,0.28)');
 g.fillStyle=vg;g.fillRect(x,y,w,h);
 // 室内剪影（远处的柜子、画框），很淡
 g.fillStyle='rgba(30,18,12,0.16)';
 if(cur==='amber'){g.fillRect(x+w*0.55,y+h*0.52,w*0.3,h*0.48);}
 if(cur==='sheer'){g.fillRect(x+w*0.18,y+h*0.60,w*0.35,h*0.40);g.fillRect(x+w*0.66,y+h*0.22,w*0.12,h*0.16);}
 if(cur==='amberL'){g.fillRect(x+w*0.12,y+h*0.25,w*0.14,h*0.18);}
 // 吊灯（女高音那扇）
 if(cur==='sop'){
  const cx=x+w*0.5;g.strokeStyle='rgba(60,40,24,0.55)';g.lineWidth=1.2;g.beginPath();g.moveTo(cx,y);g.lineTo(cx,y+18);g.stroke();
  g.fillStyle='rgba(70,46,26,0.85)';g.beginPath();g.moveTo(cx-7,y+18);g.lineTo(cx+7,y+18);g.lineTo(cx+19,y+31);g.lineTo(cx-19,y+31);g.closePath();g.fill();
  const lg=g.createRadialGradient(cx,y+33,1,cx,y+40,36);lg.addColorStop(0,'rgba(255,255,250,1)');lg.addColorStop(0.3,'rgba(255,248,230,0.7)');lg.addColorStop(1,'rgba(255,240,210,0)');
  g.fillStyle=lg;g.fillRect(x,y+18,w,h-18);
 }
 if(wi.lamp){ // 台灯
  const cx=x+w*0.78,cy=y+h*0.62;const lg=g.createRadialGradient(cx,cy,1,cx,cy,30);lg.addColorStop(0,rgba(mix(col,[255,255,255],0.6),0.9*b));lg.addColorStop(1,rgba(col,0));
  g.fillStyle=lg;g.fillRect(x,y,w,h);
  g.fillStyle='rgba(60,40,26,0.7)';g.beginPath();g.moveTo(cx-9,cy-10);g.lineTo(cx+9,cy-10);g.lineTo(cx+13,cy);g.lineTo(cx-13,cy);g.closePath();g.fill();
 }
 // 窗帘
 const curtain=(px,pw,dens,alpha,tint)=>{
  for(let i=0;i<pw;i++){const s=0.5+0.5*Math.sin(i/pw*Math.PI*2*dens+px*0.1);
   g.fillStyle=rgba(tint,alpha*(0.55+0.45*s));g.fillRect(px+i,y,1,h);
   g.fillStyle=`rgba(0,0,0,${(0.22*(1-s)).toFixed(3)})`;g.fillRect(px+i,y,1,h);}
  g.fillStyle='rgba(40,26,18,0.5)';g.fillRect(px,y+1,pw,2);
 };
 const amberT=mix(dk,[col[0]*0.92,col[1]*0.58,col[2]*0.30],k), sheerT=mix(dk,[col[0]*0.97,col[1]*0.9,col[2]*0.78],k);
