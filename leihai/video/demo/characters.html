<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="2160" height="960"></canvas>
<script>
// 四个候选主角：Clawd（升级表情）/ 原创女孩 / 小狗 / 雪人
const CW = 540, CH = 960, cv = document.getElementById('c'), ctx = cv.getContext('2d');
let _s = 17; const rnd = () => (_s = (_s * 1664525 + 1013904223) % 4294967296) / 4294967296;
const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };
function vg(y0, y1, stops) { const l = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([t, c]) => l.addColorStop(t, c)); return l; }
function rg(x, y, r0, r1, stops) { const l = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([t, c]) => l.addColorStop(t, c)); return l; }
const OUT = '#3b2a22';
function outline(w = 3) { ctx.strokeStyle = OUT; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function sky(stops, sunX, hor, sunCol = 'rgba(255,240,200,0.9)') {
  ctx.fillStyle = vg(0, hor, stops); ctx.fillRect(0, 0, CW, hor + 2);
  ctx.fillStyle = rg(sunX, hor, 0, 320, [[0, sunCol], [0.2, 'rgba(255,210,150,0.35)'], [1, 'rgba(255,200,150,0)']]); ctx.fillRect(0, 0, CW, hor + 40);
  for (let i = 0; i < 5; i++) { ctx.fillStyle = 'rgba(255,230,210,0.10)'; ell(rnd() * CW, 60 + rnd() * (hor - 160), 120 + rnd() * 80, 10 + rnd() * 8); ctx.fill(); }
}
function sea(hor, bottom, sunX, c0 = '#86a9b6', c1 = '#2f5d75') {
  ctx.fillStyle = vg(hor, bottom, [[0, c0], [1, c1]]); ctx.fillRect(0, hor, CW, bottom - hor);
  for (let i = 0; i < 160; i++) { const y = hor + 3 + Math.pow(rnd(), 1.4) * (bottom - hor), x = sunX + gauss() * (8 + (y - hor) * 0.45);
    ctx.fillStyle = `rgba(255,${225 + rnd() * 25},${170 + rnd() * 50},${0.35 + rnd() * 0.5})`; ell(x, y, 2 + rnd() * (5 + (y - hor) * 0.08), 1 + rnd()); ctx.fill(); }
}
function sand(y0, c0 = '#d8c39c', c1 = '#e6d4b1') { ctx.fillStyle = vg(y0, CH, [[0, c0], [1, c1]]); ctx.fillRect(0, y0, CW, CH - y0);
  ctx.strokeStyle = 'rgba(255,255,250,0.85)'; ctx.lineWidth = 2.5; ctx.beginPath(); for (let x = -10; x <= CW + 10; x += 18) { const y = y0 + 4 + Math.sin(x * 0.03) * 4; x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
function shadow(x, y, rx) { ctx.fillStyle = rg(x, y, 0, rx, [[0, 'rgba(60,45,40,0.35)'], [1, 'rgba(60,45,40,0)']]); ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.18); ctx.fillRect(-rx, -rx, 2 * rx, 2 * rx); ctx.restore(); }
function label(title, line1, line2) {
  ctx.fillStyle = 'rgba(246,239,227,0.94)'; ctx.fillRect(0, 770, CW, 190);
  ctx.fillStyle = '#463c34'; ctx.font = 'bold 34px "Noto Serif CJK SC"'; ctx.fillText(title, 28, 818);
  ctx.fillStyle = '#6e645a'; ctx.font = '22px "Noto Serif CJK SC"'; ctx.fillText(line1, 28, 862); ctx.fillText(line2, 28, 898);
}
function bowl(x, y, r) {
  ctx.fillStyle = 'rgba(220,240,245,0.35)'; ell(x, y, r, r); ctx.fill();
  ctx.save(); ell(x, y, r, r); ctx.clip(); ctx.fillStyle = vg(y - r * 0.4, y + r, [[0, 'rgba(140,200,210,0.55)'], [1, 'rgba(70,130,150,0.7)']]); ctx.fillRect(x - r, y - r * 0.4, 2 * r, 2 * r); ctx.restore();
  ell(x, y, r, r); ctx.strokeStyle = 'rgba(40,60,70,0.75)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#4f78c4'; ell(x - r * 0.15, y + r * 0.2, r * 0.28, r * 0.15); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + r * 0.08, y + r * 0.2); ctx.lineTo(x + r * 0.3, y + r * 0.05); ctx.lineTo(x + r * 0.3, y + r * 0.35); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x, y, r * 0.8, Math.PI * 1.05, Math.PI * 1.3); ctx.stroke();
}
function card(i, fn) { ctx.save(); ctx.translate(i * CW, 0); ctx.beginPath(); ctx.rect(0, 0, CW, CH); ctx.clip(); fn(); ctx.restore(); }

// ---------- 1. Clawd, upgraded expressions (front view, like the previous video) ----------
card(0, () => {
  sky([[0, '#6c77a6'], [0.5, '#e6a58f'], [1, '#fbd9a4']], 420, 470); sea(470, 600, 420); sand(600);
  shadow(270, 715, 170);
  const x = 150, y = 470, w = 240, h = 180;
  for (const lx of [x + 22, x + 76, x + 140, x + 194]) { ctx.fillStyle = vg(y + h, y + h + 60, [[0, '#d98561'], [1, '#b8653f']]); rrect(lx, y + h - 4, 26, 62, 3); ctx.fill(); outline(); }
  ctx.fillStyle = vg(y, y + h, [[0, '#f2a482'], [1, '#d7805c']]); rrect(x, y, w, h, 4); ctx.fill(); outline(3.2);
  ctx.strokeStyle = 'rgba(80,40,30,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + w * 0.68, y + 3); ctx.lineTo(x + w * 0.68, y + h - 3); ctx.stroke();
  ctx.fillStyle = 'rgba(255,225,180,0.5)'; ctx.fillRect(x + 4, y + 4, 4, h - 8);
  // eyes looking down at the bowl, soft lids, a watery glint
  for (const ex of [x + 64, x + 150]) { ctx.fillStyle = '#2a1f1b'; rrect(ex, y + 48, 18, 38, 4); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(ex + 4, y + 66, 5, 7);
    ctx.fillStyle = 'rgba(242,164,130,1)'; ctx.fillRect(ex - 2, y + 44, 22, 10); }
  ctx.fillStyle = 'rgba(200,236,248,0.95)'; ell(x + 73, y + 98, 5, 8); ctx.fill();
  ctx.fillStyle = 'rgba(235,110,110,0.25)'; ell(x + 50, y + 108, 20, 9); ctx.fill(); ell(x + 186, y + 108, 20, 9); ctx.fill();
  // arms holding the bowl
  ctx.fillStyle = '#eb9b77'; ctx.save(); ctx.translate(x + 10, y + 110); ctx.rotate(0.9); rrect(0, -11, 70, 22, 3); ctx.fill(); outline(); ctx.restore();
  ctx.save(); ctx.translate(x + w - 10, y + 110); ctx.rotate(Math.PI - 0.9); rrect(0, -11, 70, 22, 3); ctx.fill(); outline(); ctx.restore();
  bowl(x + w / 2, y + h + 8, 58);
  label('① Clawd（升级表情）', '延续《下一站》的系列感；加眨眼、低头、', '脸红和水光。故事：《还给海》');
});

// ---------- 2. an original girl (could become the account's own character) ----------
card(1, () => {
  sky([[0, '#5d6a8e'], [0.55, '#9aa6b8'], [1, '#d9d6cf']], 300, 480, 'rgba(240,240,235,0.5)'); sea(480, 610, 300, '#8ea3ad', '#4d6878'); sand(610, '#b8ad98', '#cfc4ae');
  // rain
  ctx.strokeStyle = 'rgba(235,240,245,0.45)'; ctx.lineWidth = 1.5; for (let i = 0; i < 140; i++) { const x = rnd() * CW, y = rnd() * 760; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 18); ctx.stroke(); }
  shadow(270, 740, 120);
  const cx = 270;
  // legs + boots
  for (const lx of [cx - 30, cx + 10]) { ctx.fillStyle = '#f3d6c3'; rrect(lx, 640, 20, 60, 6); ctx.fill(); outline(2.5); ctx.fillStyle = '#b8483c'; rrect(lx - 4, 690, 30, 34, 8); ctx.fill(); outline(2.5); }
  // raincoat (mustard), left shoulder darker = wet (the umbrella leans to the other side)
  ctx.fillStyle = vg(470, 660, [[0, '#f0c55a'], [1, '#d9a93e']]); ctx.beginPath(); ctx.moveTo(cx - 55, 480); ctx.lineTo(cx + 55, 480); ctx.lineTo(cx + 88, 660); ctx.lineTo(cx - 88, 660); ctx.closePath(); ctx.fill(); outline();
  ctx.fillStyle = 'rgba(120,90,40,0.35)'; ctx.beginPath(); ctx.moveTo(cx - 55, 480); ctx.lineTo(cx - 20, 480); ctx.lineTo(cx - 40, 560); ctx.lineTo(cx - 72, 560); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(80,60,30,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, 485); ctx.lineTo(cx, 655); ctx.stroke();
  for (const by of [520, 565, 610]) { ctx.fillStyle = '#7a5a2a'; ell(cx + 10, by, 4, 4); ctx.fill(); }
  // arm up to the umbrella handle
  ctx.fillStyle = '#e9b84c'; ctx.save(); ctx.translate(cx + 40, 500); ctx.rotate(-1.2); rrect(0, -12, 70, 24, 10); ctx.fill(); outline(); ctx.restore();
  // head
  ctx.fillStyle = '#3d2b25'; ell(cx, 420, 78, 74); ctx.fill(); outline();
  ctx.fillStyle = '#f6dcc8'; ell(cx, 432, 62, 58); ctx.fill(); outline(2.5);
  ctx.fillStyle = '#3d2b25'; ctx.beginPath(); ctx.moveTo(cx - 66, 420); ctx.quadraticCurveTo(cx - 20, 360, cx + 66, 410); ctx.quadraticCurveTo(cx + 20, 382, cx - 10, 392); ctx.quadraticCurveTo(cx - 40, 400, cx - 66, 420); ctx.fill();
  ctx.fillStyle = '#2a1f1b'; ell(cx - 22, 440, 6, 8); ctx.fill(); ell(cx + 22, 440, 6, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ell(cx - 24, 437, 2, 2.5); ctx.fill(); ell(cx + 20, 437, 2, 2.5); ctx.fill();
  ctx.fillStyle = 'rgba(235,120,110,0.35)'; ell(cx - 38, 460, 12, 6); ctx.fill(); ell(cx + 38, 460, 12, 6); ctx.fill();
  ctx.strokeStyle = '#8a4a3a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 7, 470); ctx.quadraticCurveTo(cx, 466, cx + 7, 470); ctx.stroke();
  // clear umbrella tilted to the empty side
  ctx.save(); ctx.translate(cx + 150, 285); ctx.rotate(0.5);
  ctx.strokeStyle = '#6e645a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 190); ctx.stroke();
  ctx.fillStyle = 'rgba(220,235,245,0.45)'; ctx.beginPath(); ctx.moveTo(-150, 20); ctx.quadraticCurveTo(0, -110, 150, 20); ctx.quadraticCurveTo(0, 0, -150, 20); ctx.fill(); ctx.strokeStyle = 'rgba(70,90,110,0.8)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
  label('② 原创女孩（可做账号形象）', '情歌共鸣最强，也能攒自己的 IP。', '故事：《半把伞》');
});

// ---------- 3. a small dog on the pier ----------
card(2, () => {
  sky([[0, '#4f5a86'], [0.5, '#c98f94'], [1, '#f6c690']], 120, 450); sea(450, CH, 120);
  // pier
  ctx.fillStyle = vg(560, 760, [[0, '#8a6a52'], [1, '#6b4f3c']]); ctx.beginPath(); ctx.moveTo(0, 600); ctx.lineTo(CW, 560); ctx.lineTo(CW, 640); ctx.lineTo(0, 700); ctx.closePath(); ctx.fill(); outline(2.5);
  for (let k = 0; k < 12; k++) { const x = k * 48; ctx.strokeStyle = 'rgba(40,25,15,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, 600 - x * 40 / CW); ctx.lineTo(x + 6, 700 - x * 60 / CW); ctx.stroke(); }
  for (const px of [60, 250, 440]) { ctx.fillStyle = '#5a4030'; ctx.fillRect(px, 690 - px * 60 / CW, 18, 120); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.strokeRect(px, 690 - px * 60 / CW, 18, 120); }
  const cx = 250, cy = 520;
  // tail
  ctx.fillStyle = '#f1dcbc'; ctx.beginPath(); ctx.moveTo(cx - 70, cy + 20); ctx.quadraticCurveTo(cx - 130, cy - 10, cx - 100, cy - 50); ctx.quadraticCurveTo(cx - 90, cy - 10, cx - 55, cy + 5); ctx.fill(); outline(2.5);
  // body sitting
  ctx.fillStyle = vg(cy - 40, cy + 70, [[0, '#f8e7cb'], [1, '#e2c49b']]); ell(cx - 20, cy + 20, 70, 58); ctx.fill(); outline();
  ctx.fillStyle = '#fbf2e2'; ell(cx + 22, cy + 22, 30, 45); ctx.fill();
  for (const lx of [cx - 10, cx + 30]) { ctx.fillStyle = '#f4e3c6'; rrect(lx, cy + 40, 22, 40, 9); ctx.fill(); outline(2.5); }
  // head looking out to sea (to the left, where the boat used to come in)
  ctx.fillStyle = vg(cy - 130, cy - 20, [[0, '#f8e7cb'], [1, '#e8cfa8']]); ell(cx + 10, cy - 70, 58, 52); ctx.fill(); outline();
  ctx.fillStyle = '#e9cfa8'; ctx.beginPath(); ctx.moveTo(cx - 20, cy - 110); ctx.lineTo(cx - 40, cy - 150); ctx.lineTo(cx + 5, cy - 118); ctx.fill(); outline(2.5);
  ctx.beginPath(); ctx.moveTo(cx + 25, cy - 118); ctx.lineTo(cx + 50, cy - 150); ctx.lineTo(cx + 55, cy - 105); ctx.fill(); outline(2.5);
  ctx.fillStyle = '#fbf2e2'; ell(cx - 38, cy - 55, 28, 20); ctx.fill(); outline(2.5);
  ctx.fillStyle = '#2a1f1b'; ell(cx - 62, cy - 60, 6, 5); ctx.fill(); ell(cx - 10, cy - 78, 5, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ell(cx - 11, cy - 81, 1.8, 2.2); ctx.fill();
  // red knitted scarf, one end lifted by the sea wind
  ctx.fillStyle = '#c4473d'; rrect(cx - 30, cy - 30, 86, 22, 10); ctx.fill(); outline(2.5);
  ctx.beginPath(); ctx.moveTo(cx + 40, cy - 22); ctx.quadraticCurveTo(cx + 90, cy - 30, cx + 120, cy - 60); ctx.lineTo(cx + 110, cy - 38); ctx.quadraticCurveTo(cx + 85, cy - 12, cx + 44, cy - 6); ctx.closePath(); ctx.fill(); outline(2.5);
  // a far boat on the horizon
  ctx.fillStyle = '#3b3a48'; ctx.beginPath(); ctx.moveTo(60, 446); ctx.lineTo(96, 446); ctx.lineTo(90, 452); ctx.lineTo(66, 452); ctx.closePath(); ctx.fill(); ctx.fillRect(76, 432, 3, 14);
  label('③ 小狗（最容易共鸣）', '在码头等一艘不会再回来的船。', '故事：《等潮》');
});

// ---------- 4. a snowman by the winter sea ----------
card(3, () => {
  sky([[0, '#9fb3cc'], [0.6, '#dfe5ea'], [1, '#f4efe6']], 380, 470, 'rgba(255,250,235,0.7)'); sea(470, 600, 380, '#9db7c3', '#5f8698'); sand(600, '#eef1f3', '#ffffff');
  for (let i = 0; i < 120; i++) { ctx.fillStyle = `rgba(255,255,255,${0.5 + rnd() * 0.5})`; ell(rnd() * CW, rnd() * 760, 1.5 + rnd() * 2.5, 1.5 + rnd() * 2.5); ctx.fill(); }
  const cx = 270;
  // meltwater trickling toward the sea
  ctx.fillStyle = 'rgba(150,190,210,0.55)'; ctx.beginPath(); ctx.moveTo(cx - 60, 745); ctx.quadraticCurveTo(cx - 140, 720, cx - 230, 640); ctx.lineTo(cx - 215, 640); ctx.quadraticCurveTo(cx - 120, 710, cx - 40, 735); ctx.closePath(); ctx.fill();
  shadow(cx, 748, 120);
  ctx.fillStyle = rg(cx - 30, 620, 10, 110, [[0, '#ffffff'], [1, '#dde6ee']]); ell(cx, 660, 100, 92); ctx.fill(); outline();
  ctx.fillStyle = rg(cx - 20, 500, 5, 75, [[0, '#ffffff'], [1, '#dde6ee']]); ell(cx, 520, 66, 62); ctx.fill(); outline();
  // drips
  for (const [dx, dy] of [[-40, 575], [30, 580]]) { ctx.fillStyle = 'rgba(170,210,230,0.9)'; ell(cx + dx, dy, 4, 7); ctx.fill(); }
  // face: coal eyes (one slightly lower, as if melting), carrot nose
  ctx.fillStyle = '#2a2622'; ell(cx - 22, 505, 7, 7); ctx.fill(); ell(cx + 22, 509, 7, 7); ctx.fill();
  ctx.fillStyle = '#e8883a'; ctx.beginPath(); ctx.moveTo(cx - 4, 522); ctx.lineTo(cx + 44, 532); ctx.lineTo(cx - 2, 538); ctx.closePath(); ctx.fill(); outline(2);
  for (let k = 0; k < 5; k++) { ctx.fillStyle = '#2a2622'; ell(cx - 24 + k * 12, 556 + Math.sin(k / 4 * Math.PI) * 6, 3, 3); ctx.fill(); }
  // twig arms, one reaching toward the sea
  ctx.strokeStyle = '#5a4030'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx - 80, 620); ctx.lineTo(cx - 170, 560); ctx.moveTo(cx - 140, 578); ctx.lineTo(cx - 150, 548); ctx.moveTo(cx + 80, 625); ctx.lineTo(cx + 150, 600); ctx.stroke();
  // blue knitted scarf (left by the one who built it)
  ctx.fillStyle = '#5f86c0'; rrect(cx - 62, 570, 124, 26, 12); ctx.fill(); outline(2.5);
  rrect(cx + 20, 585, 26, 80, 8); ctx.fill(); outline(2.5);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(cx - 50 + k * 20, 574); ctx.lineTo(cx - 50 + k * 20, 592); ctx.stroke(); }
  label('④ 雪人（最有画面记忆点）', '两个人堆的雪人，春天化成水流进海。', '故事：《雪人去了海》');
});
// paper grain
{ const img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data; for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 8; d[i] += n; d[i + 1] += n; d[i + 2] += n; } ctx.putImageData(img, 0, 0); }
ctx.fillStyle = 'rgba(70,60,52,0.35)'; for (let i = 1; i < 4; i++) ctx.fillRect(i * CW - 1, 0, 2, CH);
document.title = 'done';
</script></body></html>
