<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="840"></canvas>
<script>
// 《还给海》60 s 精修版：光影、景深、浪花质感、角色受光
const W = 1080, H = 840, cv = document.getElementById('c'), ctx = cv.getContext('2d');
let _s = 99; const rnd = () => (_s = (_s * 1664525 + 1013904223) % 4294967296) / 4294967296;
const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };
function layer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; }
function vg(g, y0, y1, stops) { const l = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([t, c]) => l.addColorStop(t, c)); return l; }
function rg(g, x, y, r0, r1, stops) { const l = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([t, c]) => l.addColorStop(t, c)); return l; }
function blurDraw(dst, src, px, op = 'source-over', a = 1) { dst.save(); dst.filter = `blur(${px}px)`; dst.globalCompositeOperation = op; dst.globalAlpha = a; dst.drawImage(src, 0, 0); dst.restore(); }

const HOR = 440, SHORE = 660, SUNX = 230;
// ---------- sky ----------
ctx.fillStyle = vg(ctx, 0, HOR, [[0, '#4c5688'], [0.32, '#9a7fa6'], [0.62, '#e59b8a'], [0.86, '#f8c38a'], [1, '#ffe0a6']]);
ctx.fillRect(0, 0, W, HOR + 2);
// clouds: soft bodies + sunlit rims
{
  const [c, g] = layer();
  const clouds = [[160, 110, 260, 30], [640, 80, 240, 26], [930, 170, 220, 22], [420, 215, 200, 18], [760, 285, 170, 12], [90, 300, 150, 10]];
  for (const [x, y, rx, ry] of clouds) {
    for (let i = 0; i < 16; i++) {
      g.fillStyle = `rgba(${226 + rnd() * 20},${150 + rnd() * 30},${150 + rnd() * 20},0.16)`;
      g.beginPath(); g.ellipse(x + gauss() * rx * 0.35, y + gauss() * ry * 0.4, rx * (0.3 + rnd() * 0.4), ry * (0.6 + rnd() * 0.6), 0, 0, Math.PI * 2); g.fill();
    }
    for (let i = 0; i < 8; i++) {
      g.fillStyle = 'rgba(255,226,180,0.18)';
      g.beginPath(); g.ellipse(x - rx * 0.1 + gauss() * rx * 0.25, y + ry * 0.45, rx * (0.25 + rnd() * 0.3), ry * 0.35, 0, 0, Math.PI * 2); g.fill();
    }
  }
  blurDraw(ctx, c, 7);
}
// sun, bloom, rays
ctx.fillStyle = rg(ctx, SUNX, HOR, 0, 420, [[0, 'rgba(255,240,200,0.95)'], [0.12, 'rgba(255,214,150,0.6)'], [0.45, 'rgba(255,170,120,0.18)'], [1, 'rgba(255,160,120,0)']]);
ctx.fillRect(0, 0, W, HOR + 40);
{
  const [c, g] = layer(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) { const a = -Math.PI + 0.25 + i * 0.19 + gauss() * 0.03, w = 0.025 + rnd() * 0.03;
    g.fillStyle = `rgba(255,220,170,${0.05 + rnd() * 0.05})`; g.beginPath(); g.moveTo(SUNX, HOR);
    g.lineTo(SUNX + Math.cos(a - w) * 900, HOR + Math.sin(a - w) * 900); g.lineTo(SUNX + Math.cos(a + w) * 900, HOR + Math.sin(a + w) * 900); g.fill(); }
  blurDraw(ctx, c, 10, 'screen', 0.8);
}
ctx.fillStyle = rg(ctx, SUNX, HOR, 0, 48, [[0, '#fffbe8'], [0.7, '#ffe6a6'], [1, 'rgba(255,214,140,0)']]);
ctx.beginPath(); ctx.arc(SUNX, HOR, 48, Math.PI, 0); ctx.fill();

// ---------- sea ----------
ctx.fillStyle = vg(ctx, HOR, SHORE, [[0, '#86a9b6'], [0.25, '#5f8ea3'], [1, '#2c5a72']]);
ctx.fillRect(0, HOR, W, SHORE - HOR);
{
  const [c, g] = layer();
  for (let i = 0; i < 260; i++) { const y = HOR + 3 + Math.pow(rnd(), 1.3) * (SHORE - HOR), sc = (y - HOR) / (SHORE - HOR);
    g.strokeStyle = rnd() < 0.5 ? `rgba(20,55,75,${0.12 + sc * 0.12})` : `rgba(200,225,230,${0.08 + rnd() * 0.08})`;
    g.lineWidth = 1 + sc * 2.5; const x = rnd() * W, l = 20 + sc * 90 * rnd(); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 1.5 - sc * 2, x + l, y); g.stroke(); }
  blurDraw(ctx, c, 0.8);
}
// glitter path under the sun
{
  const [c, g] = layer();
  for (let i = 0; i < 420; i++) { const y = HOR + 2 + Math.pow(rnd(), 1.4) * (SHORE - HOR), sp = 12 + (y - HOR) * 0.55, x = SUNX + gauss() * sp, l = 3 + rnd() * (8 + (y - HOR) * 0.12);
    g.fillStyle = `rgba(255,${220 + rnd() * 30},${160 + rnd() * 60},${0.4 + rnd() * 0.6})`; g.beginPath(); g.ellipse(x, y, l, 1 + rnd() * 1.4, 0, 0, Math.PI * 2); g.fill(); }
  blurDraw(ctx, c, 4, 'screen', 0.9); ctx.drawImage(c, 0, 0);
}
ctx.fillStyle = 'rgba(255,230,190,0.35)'; ctx.fillRect(0, HOR - 1, W, 2);

// ---------- the frozen wave ----------
function wavePath(g, dx = 0) {
  g.beginPath(); g.moveTo(590 + dx, SHORE + 12);
  g.bezierCurveTo(690 + dx, 628, 736 + dx, 526, 750 + dx, 432);
  g.bezierCurveTo(758 + dx, 372, 744 + dx, 336, 706 + dx, 326);
  g.bezierCurveTo(680 + dx, 320, 662 + dx, 334, 672 + dx, 354);
  g.bezierCurveTo(700 + dx, 344, 734 + dx, 326, 786 + dx, 298);
  g.bezierCurveTo(866 + dx, 258, 986 + dx, 266, 1110 + dx, 292);
  g.lineTo(1110 + dx, SHORE + 12); g.closePath();
}
{
  const [c, g] = layer();
  wavePath(g); g.save(); g.clip();
  g.fillStyle = vg(g, 260, SHORE + 12, [[0, '#c9f2e6'], [0.18, '#8fd3cb'], [0.45, '#4f9aa8'], [0.8, '#2d6a82'], [1, '#234f66']]);
  g.fillRect(560, 240, 560, SHORE);
  // subsurface light where the sun shines through the thin crest
  g.globalCompositeOperation = 'screen';
  g.fillStyle = rg(g, 800, 330, 0, 230, [[0, 'rgba(230,255,235,0.75)'], [0.5, 'rgba(160,230,210,0.25)'], [1, 'rgba(120,200,190,0)']]); g.fillRect(560, 200, 560, 500);
  g.fillStyle = rg(g, 760, 360, 0, 120, [[0, 'rgba(255,225,170,0.45)'], [1, 'rgba(255,225,170,0)']]); g.fillRect(560, 200, 560, 500);
  g.globalCompositeOperation = 'source-over';
  // flowing lines along the face
  for (let k = 0; k < 60; k++) {
    const dx = 8 + k * 7 + gauss() * 2, light = rnd() < 0.35;
    g.strokeStyle = light ? `rgba(235,255,250,${0.06 + rnd() * 0.12})` : `rgba(25,70,90,${0.05 + rnd() * 0.1})`;
    g.lineWidth = 0.8 + rnd() * 2.2; g.beginPath(); g.moveTo(592 + dx, SHORE + 12);
    g.bezierCurveTo(690 + dx, 628, 736 + dx * 0.9, 526, 750 + dx * 0.82, 432 - dx * 0.34);
    g.bezierCurveTo(758 + dx * 0.72, 372 - dx * 0.44, 762 + dx * 0.62, 330 - dx * 0.3, 786 + dx * 0.92, 298 - dx * 0.04); g.stroke();
  }
  // hollow under the lip
  g.fillStyle = rg(g, 712, 392, 0, 70, [[0, 'rgba(18,52,70,0.55)'], [1, 'rgba(18,52,70,0)']]); g.fillRect(620, 300, 200, 200);
  g.restore();
  blurDraw(ctx, c, 0.6);
  // edge: thin, slightly darker line (matches the character outline, but softer)
  ctx.save(); wavePath(ctx); ctx.strokeStyle = 'rgba(28,48,58,0.55)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}
// foam: noisy white along the lip and crest, soft + crisp passes
{
  const [c, g] = layer();
  const lip = t => { // param along lip -> crest
    const P = [[706, 326], [680, 320], [662, 334], [672, 354], [700, 344], [734, 326], [786, 298], [866, 258], [986, 266], [1110, 292]];
    const i = Math.min(P.length - 2, Math.floor(t * (P.length - 1))), f = t * (P.length - 1) - i;
    return [P[i][0] + (P[i + 1][0] - P[i][0]) * f, P[i][1] + (P[i + 1][1] - P[i][1]) * f];
  };
  for (let i = 0; i < 2200; i++) { const t = rnd(), [x, y] = lip(t), r = 1 + rnd() * 4.5;
    g.fillStyle = `rgba(255,255,252,${0.25 + rnd() * 0.6})`; g.beginPath(); g.arc(x + gauss() * 5, y + Math.abs(gauss()) * (6 + t * 14), r, 0, Math.PI * 2); g.fill(); }
  blurDraw(ctx, c, 3, 'source-over', 0.85); ctx.drawImage(c, 0, 0);
}
// suspended spray with highlights (time is stopped), plus big soft bokeh drops
function drop(g, x, y, r, a = 1) {
  g.fillStyle = rg(g, x - r * 0.3, y - r * 0.3, 0, r, [[0, `rgba(255,255,255,${0.95 * a})`], [0.45, `rgba(225,245,245,${0.55 * a})`], [1, `rgba(190,225,230,${0.08 * a})`]]);
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
for (let i = 0; i < 110; i++) { const a = rnd() * Math.PI, r = 30 + rnd() * 150, x = 730 + Math.cos(a) * r * 1.35 - 30, y = 300 - Math.sin(a) * r * 0.9 + gauss() * 8;
  drop(ctx, x, y, 1.5 + Math.pow(rnd(), 2) * 6); }
{
  const [c, g] = layer();
  for (const [x, y, r] of [[980, 120, 26], [880, 60, 16], [1030, 250, 20], [60, 700, 30], [140, 780, 22]]) drop(g, x, y, r, 0.5);
  blurDraw(ctx, c, 6, 'screen', 0.9);
}

// ---------- shallow water & wet sand ----------
ctx.fillStyle = vg(ctx, SHORE, H, [[0, '#7fa3ac'], [0.18, '#a6b3a8'], [0.4, '#cdb896'], [1, '#d9c39c']]);
ctx.fillRect(0, SHORE, W, H - SHORE);
// sky reflected in the wet sand
{
  const [c, g] = layer(); g.save(); g.translate(0, SHORE * 2); g.scale(1, -1); g.drawImage(cv, 0, 0, W, SHORE, 0, 0, W, SHORE); g.restore();
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = vg(g, SHORE, H, [[0, 'rgba(0,0,0,0.55)'], [0.5, 'rgba(0,0,0,0.15)'], [1, 'rgba(0,0,0,0)']]); g.fillRect(0, SHORE, W, H - SHORE);
  blurDraw(ctx, c, 5);
}
{
  const [c, g] = layer(); g.lineCap = 'round';
  for (const [y0, a] of [[SHORE + 4, 0.9], [SHORE + 40, 0.55], [SHORE + 96, 0.35]]) {
    g.strokeStyle = `rgba(255,252,245,${a})`; g.lineWidth = 3; g.beginPath();
    for (let x = -20; x <= W + 20; x += 20) { const y = y0 + Math.sin(x * 0.012 + y0) * 6 + gauss() * 1.2; x === -20 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
  }
  blurDraw(ctx, c, 1.2); ctx.globalAlpha = 0.7; ctx.drawImage(c, 0, 0); ctx.globalAlpha = 1;
}

// ---------- Clawd: same boxy design, now lit by the low sun ----------
const OUT = '#3b2a22';
function litBox(x, y, w, h, base, shade, rim = true) {
  ctx.fillStyle = vg(ctx, y, y + h, [[0, base], [1, shade]]); ctx.fillRect(x, y, w, h);
  const g2 = ctx.createLinearGradient(x, 0, x + w, 0); g2.addColorStop(0, 'rgba(255,214,160,0.45)'); g2.addColorStop(0.25, 'rgba(255,214,160,0)'); g2.addColorStop(1, 'rgba(60,40,60,0.18)');
  ctx.fillStyle = g2; ctx.fillRect(x, y, w, h);
  if (rim) { ctx.fillStyle = 'rgba(255,226,170,0.9)'; ctx.fillRect(x + 2, y + 3, 3, h - 6); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeRect(x, y, w, h);
}
const CX = 330, CY = 488, CW = 160, CH = 148;
// contact shadow + reflection
ctx.fillStyle = rg(ctx, CX + 80, CY + CH + 36, 0, 110, [[0, 'rgba(40,60,70,0.35)'], [1, 'rgba(40,60,70,0)']]); ctx.fillRect(CX - 40, CY + CH, 240, 80);
ctx.save(); ctx.globalAlpha = 0.22; ctx.filter = 'blur(3px)'; ctx.fillStyle = '#d9825f'; ctx.fillRect(CX + 6, CY + CH + 44, CW - 12, 70); ctx.restore();
litBox(CX + 30, CY + CH - 4, 22, 36, '#c9744f', '#9b5638', false); litBox(CX + 104, CY + CH - 4, 22, 36, '#c9744f', '#9b5638', false);
// water around the ankles
ctx.fillStyle = 'rgba(130,170,178,0.8)'; ctx.fillRect(CX + 14, CY + CH + 18, 132, 16);
ctx.strokeStyle = 'rgba(255,255,250,0.9)'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(CX + 12, CY + CH + 18); ctx.bezierCurveTo(CX + 50, CY + CH + 12, CX + 110, CY + CH + 24, CX + 150, CY + CH + 17); ctx.stroke();
litBox(CX, CY, CW, CH, '#eb9b77', '#c86f4f');
// eye
ctx.fillStyle = '#2a1f1b'; ctx.fillRect(CX + CW - 28, CY + 26, 8, 20);
ctx.fillStyle = '#fff'; ctx.fillRect(CX + CW - 26, CY + 29, 2.5, 3.5);
// arms
litBox(CX + CW - 3, CY + 70, 58, 20, '#eb9b77', '#cf7858', false);
litBox(CX + CW - 3, CY + 104, 56, 20, '#eb9b77', '#cf7858', false);

// ---------- glass bowl, tilted, water pouring as a frozen ribbon ----------
ctx.save(); ctx.translate(CX + CW + 96, CY + 72); ctx.rotate(0.62);
const R = 60, mw = Math.sqrt(R * R - 44 * 44);
ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();
ctx.fillStyle = 'rgba(210,235,238,0.22)'; ctx.fillRect(-R, -R, 2 * R, 2 * R);
ctx.fillStyle = vg(ctx, 0, R, [[0, 'rgba(150,210,215,0.55)'], [1, 'rgba(90,150,165,0.7)']]); ctx.fillRect(-R, 6, 2 * R, R);
ctx.restore();
ctx.strokeStyle = 'rgba(40,60,70,0.75)'; ctx.lineWidth = 2.2;
ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2 + Math.asin(mw / R), 1.5 * Math.PI - Math.asin(mw / R)); ctx.stroke();
ctx.beginPath(); ctx.ellipse(0, -44, mw, 6, 0, 0, Math.PI * 2); ctx.stroke();
ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineCap = 'round';
ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, R - 9, Math.PI * 1.02, Math.PI * 1.3); ctx.stroke();
ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, R - 9, Math.PI * 1.36, Math.PI * 1.42); ctx.stroke();
ctx.fillStyle = 'rgba(255,240,210,0.5)'; ctx.beginPath(); ctx.ellipse(R * 0.45, R * 0.35, 8, 4, 0.6, 0, Math.PI * 2); ctx.fill();
ctx.restore();
// hands over the glass
litBox(CX + CW + 50, CY + 66, 15, 20, '#eb9b77', '#cf7858', false); litBox(CX + CW + 46, CY + 100, 15, 20, '#eb9b77', '#cf7858', false);
// the pour: translucent ribbon breaking into drops
ctx.save(); ctx.lineCap = 'round';
for (let k = 0; k < 3; k++) { ctx.strokeStyle = `rgba(205,240,242,${0.55 - k * 0.15})`; ctx.lineWidth = 10 - k * 3; ctx.beginPath(); ctx.moveTo(612, 524); ctx.bezierCurveTo(640, 492, 672, 482, 700, 500); ctx.stroke(); }
ctx.restore();
for (let i = 0; i < 34; i++) { const t = i / 33, x = 690 + t * 60 + gauss() * 5, y = 496 + t * 70 + gauss() * 5; drop(ctx, x, y, 2 + rnd() * 4); }

// ---------- the little blue fish, mid-leap, looking back ----------
ctx.save(); ctx.translate(624, 404); ctx.rotate(0.45 + Math.PI);
ctx.fillStyle = vg(ctx, -14, 14, [[0, '#7fa6ec'], [0.5, '#4f78c4'], [1, '#2f4f94']]);
ctx.beginPath(); ctx.ellipse(0, 0, 24, 13, 0, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(40, -14); ctx.quadraticCurveTo(34, 0, 40, 14); ctx.closePath(); ctx.fill();
ctx.beginPath(); ctx.moveTo(-2, -11); ctx.quadraticCurveTo(6, -22, 14, -10); ctx.closePath(); ctx.fill();
ctx.strokeStyle = 'rgba(30,40,70,0.8)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(0, 0, 24, 13, 0, 0, Math.PI * 2); ctx.stroke();
ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-4, -6, 10, 3, -0.1, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = '#1b1b24'; ctx.beginPath(); ctx.arc(-12, -2, 2.8, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-12.8, -2.8, 1, 0, Math.PI * 2); ctx.fill();
ctx.restore();
ctx.fillStyle = rg(ctx, 624, 404, 0, 60, [[0, 'rgba(255,230,180,0.25)'], [1, 'rgba(255,230,180,0)']]); ctx.fillRect(560, 340, 130, 130);

// ---------- finishing: bloom, frozen-time grade, vignette, paper grain ----------
{
  const [c, g] = layer(); g.drawImage(cv, 0, 0);
  ctx.save(); ctx.filter = 'blur(18px) brightness(1.15)'; ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.28; ctx.drawImage(c, 0, 0); ctx.restore();
}
ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = 'rgba(128,128,128,0.12)'; ctx.fillRect(0, 0, W, H); ctx.restore();
ctx.fillStyle = rg(ctx, W / 2, H / 2, H * 0.45, H * 0.95, [[0, 'rgba(30,20,40,0)'], [1, 'rgba(30,20,40,0.35)']]); ctx.fillRect(0, 0, W, H);
{
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}
document.title = 'done';
</script></body></html>
